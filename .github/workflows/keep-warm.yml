name: Keep the survey awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Open the health check
        run: curl -fsS --retry 3 --retry-all-errors --retry-delay 5 --max-time 60 https://stock-audit-fld.onrender.com/healthz
