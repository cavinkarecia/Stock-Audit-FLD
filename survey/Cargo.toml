[package]
name = "stock_correction_survey"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "stock_correction_survey"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "native-tls", "smtp-transport"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }
